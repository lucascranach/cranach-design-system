# Prüfungen für jeden Pull Request und jeden Stand auf main (ADR 0013): dieselben Prüfungen wie
# lokal – Build mit Stylelint und Kontrastprüfung, die Tests der Build-Skripte, alle Stories mit
# axe in beiden Themes, die statische Doku und der Paketinhalt. Veröffentlicht nichts.
name: Prüfungen

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Ein neuer Push auf denselben Branch bricht den laufenden Durchgang ab
concurrency:
  group: pruefungen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Build, Tests und axe
    runs-on: ubuntu-latest
    steps:
      # v7.0.1, per Commit festgelegt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.1.0, per Commit festgelegt; Node-Version aus .nvmrc
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Build (Stylelint, Tokens, Icons, CSS, Figma-Sync, Kontraste)
        run: npm run build

      - name: Tests der Stylelint-Regeln
        run: npm run test:lint

      - name: Tests des Figma-Sync
        run: npm run test:figma

      - name: Chromium für die Story-Tests
        run: npx playwright install --with-deps chromium

      - name: Alle Stories mit axe, hell und dunkel
        run: npm run test:storybook

      # dist/ ist gebaut; deshalb storybook build direkt statt npm run build:storybook
      - name: Doku statisch bauen
        run: npx storybook build -o storybook-static --quiet

      - name: Paketinhalt
        run: npm pack --dry-run
